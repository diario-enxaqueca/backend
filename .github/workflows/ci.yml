name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: diario_enxaqueca
          MYSQL_USER: diario_user
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        health-check:
          start_period: 40s

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for MySQL
        run: until mysqladmin ping -h 127.0.0.1 --silent; do sleep 1; done

      - name: Run tests
        env:
          DATABASE_URL: mysql+pymysql://diario_user:${{ secrets.MYSQL_PASSWORD }}@127.0.0.1:3306/diario_enxaqueca
          SECRET_KEY: dev_secret_key_32_chars_1234567
        run: pytest --maxfail=1 --disable-warnings -q
